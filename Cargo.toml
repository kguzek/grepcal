[package]
name = "grepcal"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
axum = "0.8.1"
bytes = "1.9.0"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
ical = "0.11.0"
regex = "1.11.1"
reqwest = { version = "0.13.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
sha2 = "0.10.8"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.0.0"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
